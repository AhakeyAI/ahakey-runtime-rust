name: Rust Build

on:
  push:
    branches: [ "main", "dev" ]
  pull_request:
    branches: [ "main", "dev" ]

env:
  CARGO_TERM_COLOR: always

jobs:
  build-macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - name: Format
        run: cargo fmt --check
      - name: Build
        run: cargo build --locked
      - name: Run tests
        run: cargo test --locked
      - name: Clippy
        run: cargo clippy --locked --all-targets -- -D warnings

  build-windows:

    runs-on: windows-latest

    steps:
    - uses: actions/checkout@v4
    
    - name: Build
      run: cargo build --locked --verbose
      
    - name: Run tests
      run: cargo test --locked --verbose

    - name: Upload artifacts
      uses: actions/upload-artifact@v7
      with:
        name: ahakey-${{ runner.os }}-${{ runner.arch }}
        path: |
          target/debug/ahakey-runtime-rust.exe
        if-no-files-found: error
        retention-days: 14

  build-linux:
  
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
      
      - name: Resolve Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y pkg-config libdbus-1-dev
          
      - name: Build
        run: cargo build --locked --verbose
        
      - name: Run tests
        run: cargo test --locked --verbose
  
      - name: Upload artifacts
        uses: actions/upload-artifact@v7
        with:
          name: ahakey-${{ runner.os }}-${{ runner.arch }}
          path: |
            target/debug/ahakey-runtime-rust
          if-no-files-found: error
          retention-days: 14

        
