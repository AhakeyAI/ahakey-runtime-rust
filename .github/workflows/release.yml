name: Runtime CD

on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:
    inputs:
      release_tag:
        description: '重打包已有 Release（例如 v0.1.0）；留空只构建开发包'
        required: false
        type: string

permissions:
  contents: read

concurrency:
  group: runtime-cd-${{ github.ref }}-${{ inputs.release_tag || 'development' }}
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/') }}

env:
  CARGO_TERM_COLOR: always

jobs:
  prepare:
    runs-on: ubuntu-24.04
    outputs:
      label: ${{ steps.version.outputs.label }}
      version: ${{ steps.version.outputs.version }}
      commit: ${{ steps.version.outputs.commit }}
      update_existing: ${{ steps.version.outputs.update_existing }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
          persist-credentials: false
          path: build-tools
      - name: Validate version and source
        id: version
        working-directory: build-tools
        env:
          EVENT_NAME: ${{ github.event_name }}
          REF_TYPE: ${{ github.ref_type }}
          REF_NAME: ${{ github.ref_name }}
          MANUAL_RELEASE_TAG: ${{ inputs.release_tag }}
        run: |
          python3 - <<'PY'
          import os, subprocess, tomllib
          from pathlib import Path
          manual = os.environ.get('MANUAL_RELEASE_TAG', '').strip()
          tagged = os.environ['EVENT_NAME'] == 'push' and os.environ['REF_TYPE'] == 'tag'
          commit = subprocess.check_output(['git', 'rev-parse', 'HEAD'], text=True).strip()
          if manual:
              if not manual.startswith('v') or '/' in manual:
                  raise SystemExit('release_tag must be a version tag such as v0.1.0')
              commit = subprocess.check_output(['git', 'rev-parse', '--verify', f'refs/tags/{manual}^{{commit}}'], text=True).strip()
          cargo = subprocess.check_output(['git', 'show', f'{commit}:Cargo.toml'], text=True)
          version = tomllib.loads(cargo)['package']['version']
          if tagged or manual:
              label = manual or os.environ['REF_NAME']
              if label != 'v' + version:
                  raise SystemExit(f'Tag {label} must match Cargo.toml v{version}')
              subprocess.run(['git', 'merge-base', '--is-ancestor', commit, 'origin/main'], check=True)
              notes = Path('docs/releases') / f'{label}.md'
              if not notes.is_file() or len(notes.read_text().strip()) < 200:
                  raise SystemExit(f'Write release notes first: {notes}')
          else:
              label = f'{version}-dev.{commit[:12]}'
          with open(os.environ['GITHUB_OUTPUT'], 'a') as output:
              for key, value in {'label': label, 'version': version, 'commit': commit,
                                 'update_existing': str(bool(manual)).lower()}.items():
                  output.write(f'{key}={value}\n')
          PY

  package:
    needs: prepare
    name: Package (${{ matrix.target }})
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-15
            target: aarch64-apple-darwin
            swift_target: arm64-apple-macosx13.0
          - runner: macos-15-intel
            target: x86_64-apple-darwin
            swift_target: x86_64-apple-macosx13.0
          - runner: windows-2022
            target: x86_64-pc-windows-msvc
            swift_target: ''
          - runner: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
            swift_target: ''
    defaults:
      run:
        shell: bash
        working-directory: source
    env:
      RUST_TARGET: ${{ matrix.target }}
      BUILD_LABEL: ${{ needs.prepare.outputs.label }}
      MACOSX_DEPLOYMENT_TARGET: '13.0'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          path: build-tools
          persist-credentials: false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ needs.prepare.outputs.commit }}
          path: source
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.12'
      - name: Install Linux build dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y pkg-config libdbus-1-dev dpkg-dev
      - name: Link Windows CRT statically
        if: runner.os == 'Windows'
        run: echo 'RUSTFLAGS=-C target-feature=+crt-static' >> "$GITHUB_ENV"
      - name: Install Rust toolchain
        run: |
          rustup toolchain install stable --profile minimal --component rustfmt --component clippy --target "$RUST_TARGET"
          rustup default stable
      - name: Check formatting
        run: cargo fmt --check
      - name: Check release packager
        run: python -B -m unittest discover -s "$GITHUB_WORKSPACE/build-tools/scripts/tests" -p 'test_package_runtime.py'
      - name: Build and test release
        run: |
          cargo build --locked --release --target "$RUST_TARGET"
          cargo test --locked --release --target "$RUST_TARGET"
      - name: Clippy
        if: matrix.target == 'aarch64-apple-darwin'
        run: cargo clippy --locked --all-targets --target "$RUST_TARGET" -- -D warnings
      - name: Build macOS input helper
        if: runner.os == 'macOS'
        env:
          SWIFT_TARGET: ${{ matrix.swift_target }}
        run: |
          swiftc -O -swift-version 5 -target "$SWIFT_TARGET" native/macos/InputMonitor.swift \
            -o "target/$RUST_TARGET/release/ahakey-input-monitor"
      - name: Build native installer and checksums
        run: |
          python "$GITHUB_WORKSPACE/build-tools/scripts/package-runtime.py" --repo "$PWD" \
            --target "$RUST_TARGET" --label "$BUILD_LABEL" --require-clean --packaging-commit "$GITHUB_SHA"
      - name: Verify installed package
        run: |
          case "$RUST_TARGET" in
            *apple-darwin) extension=dmg ;;
            *windows-msvc) extension=exe ;;
            *) extension=deb ;;
          esac
          python "$GITHUB_WORKSPACE/build-tools/scripts/verify-installer.py" --target "$RUST_TARGET" \
            --installer "dist/ahakey-runtime-$BUILD_LABEL-$RUST_TARGET.$extension"
      - name: Check Debian installation and removal
        if: runner.os == 'Linux'
        run: |
          sudo apt-get install -y ./dist/*.deb
          ahakey-runtime --help
          sudo apt-get remove -y ahakey-runtime
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: runtime-${{ matrix.target }}
          path: source/dist/*
          if-no-files-found: error
          overwrite: true
          retention-days: 14

  publish:
    if: (github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')) || (github.event_name == 'workflow_dispatch' && inputs.release_tag != '')
    needs: [prepare, package]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    env:
      RELEASE_TAG: ${{ needs.prepare.outputs.label }}
      RELEASE_VERSION: ${{ needs.prepare.outputs.version }}
      SOURCE_COMMIT: ${{ needs.prepare.outputs.commit }}
      UPDATE_EXISTING: ${{ needs.prepare.outputs.update_existing }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          path: build-tools
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          pattern: runtime-*
          merge-multiple: true
          path: dist
      - name: Publish verified installers and release notes
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          args=()
          if [[ "$UPDATE_EXISTING" == 'true' ]]; then
            args+=(--update-existing)
          fi
          python3 build-tools/scripts/publish-release.py --tag "$RELEASE_TAG" \
            --version "$RELEASE_VERSION" --commit "$SOURCE_COMMIT" \
            --notes "build-tools/docs/releases/$RELEASE_TAG.md" "${args[@]}"
